version: '3.8'

services:
  foot-gpt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foot_gpt_app
    ports:
      - "8501:8501"
    environment:
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY:-gsk_votre_cle_groq_ici}
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
